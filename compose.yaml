name: team-ledger

x-image: &team-ledger-image
  image: team-ledger:local

services:
  data-init:
    <<: *team-ledger-image
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test "$$(printf '%s\n' "${TEAMLEDGER_UID:?set TEAMLEDGER_UID}" "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}" "${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID}" "${TEAMLEDGER_AUDIT_RECEIVER_UID:?set TEAMLEDGER_AUDIT_RECEIVER_UID}" "${TEAMLEDGER_AUDIT_FORWARDER_UID:?set TEAMLEDGER_AUDIT_FORWARDER_UID}" | sort -u | wc -l)" -eq 5 &&
        install -d -o ${TEAMLEDGER_UID} -g ${TEAMLEDGER_GID:?set TEAMLEDGER_GID} -m 0770 /var/lib/teamledger &&
        install -d -o ${TEAMLEDGER_KEYD_UID} -g ${TEAMLEDGER_GID} -m 0700 /var/lib/teamledger-keys &&
        install -d -o ${TEAMLEDGER_KEYD_UID} -g ${TEAMLEDGER_GID} -m 0770 /run/teamledger-keyd &&
        for path in /var/lib/teamledger/teamledger.db /var/lib/teamledger/teamledger.db-wal /var/lib/teamledger/teamledger.db-shm; do
        if [ -e "$$path" ] || [ -L "$$path" ]; then
        test -f "$$path" && test ! -L "$$path" &&
        chown ${TEAMLEDGER_UID}:${TEAMLEDGER_GID} "$$path" && chmod 0660 "$$path" || exit 1;
        fi;
        done
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-keys:/var/lib/teamledger-keys
      - team-ledger-run:/run/teamledger-keyd
    restart: "no"

  key-bootstrap:
    <<: *team-ledger-image
    profiles: ["bootstrap"]
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/app/teamledger-keyctl-local", "init", "-dir", "/var/lib/teamledger-keys/material"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - team-ledger-keys:/var/lib/teamledger-keys
    restart: "no"

  audit-bootstrap:
    <<: *team-ledger-image
    profiles: ["bootstrap"]
    user: "0:0"
    environment:
      TEAMLEDGER_DB_BACKEND: "${TEAMLEDGER_AUDIT_MAINTENANCE_DB_BACKEND:-sqlite}"
      TEAMLEDGER_DB_DSN: "${TEAMLEDGER_AUDIT_MAINTENANCE_DB_DSN:-/var/lib/teamledger/teamledger.db}"
      TEAMLEDGER_DB_DSN_FILE: "${TEAMLEDGER_AUDIT_MAINTENANCE_DB_DSN_FILE:-}"
      TEAMLEDGER_DB_CA_FILE: "${TEAMLEDGER_AUDIT_MAINTENANCE_DB_CA_FILE:-}"
    command:
      - /app/teamledger-audit-bootstrap
      - init
      - -dir
      - /var/lib/teamledger-audit/material
      - -receiver-name
      - audit-receiver
      - -bootstrap-uid
      - "0"
      - -receiver-uid
      - "${TEAMLEDGER_AUDIT_RECEIVER_UID:?set TEAMLEDGER_AUDIT_RECEIVER_UID}"
      - -forwarder-uid
      - "${TEAMLEDGER_AUDIT_FORWARDER_UID:?set TEAMLEDGER_AUDIT_FORWARDER_UID}"
      - -gid
      - "${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    volumes:
      - team-ledger-audit:/var/lib/teamledger-audit
      - team-ledger-data:/var/lib/teamledger
      - ./docker/audit-maintenance:/run/teamledger-audit-maintenance:ro
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  key-upgrade:
    <<: *team-ledger-image
    profiles: ["key-upgrade"]
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/app/teamledger-keyctl-local", "upgrade-domains", "-dir", "/var/lib/teamledger-keys/material"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - team-ledger-keys:/var/lib/teamledger-keys
    restart: "no"

  key-domain-ack:
    <<: *team-ledger-image
    profiles: ["key-domain-ack"]
    user: "${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command:
      - /app/teamledger-keyctl-local
      - acknowledge-domains
      - -socket
      - /run/teamledger-keyd/keyd.sock
      - -backend
      - sqlite
      - -dsn-file
      - /run/teamledger-maintenance/sqlite-dsn
      - -request-id
      - "${TEAMLEDGER_KEY_DOMAIN_ACK_REQUEST_ID:-}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyd:
        condition: service_healthy
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-run:/run/teamledger-keyd
      - ./docker/maintenance:/run/teamledger-maintenance:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  key-check:
    <<: *team-ledger-image
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["test -f /var/lib/teamledger-keys/material/root.key && test -f /var/lib/teamledger-keys/material/keyring.bin && test -f /var/lib/teamledger-keys/material/.lock"]
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - team-ledger-keys:/var/lib/teamledger-keys
    restart: "no"

  keyd:
    <<: *team-ledger-image
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/app/teamledger-keyd"]
    environment:
      TEAMLEDGER_KEYD_DIR: /var/lib/teamledger-keys/material
      TEAMLEDGER_KEYD_SOCKET: /run/teamledger-keyd/keyd.sock
      TEAMLEDGER_KEYD_API_UIDS: "${TEAMLEDGER_UID:?set TEAMLEDGER_UID},${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}"
      TEAMLEDGER_KEYD_MAINTENANCE_UIDS: "${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID}"
    depends_on:
      key-check:
        condition: service_completed_successfully
    volumes:
      - team-ledger-keys:/var/lib/teamledger-keys
      - team-ledger-run:/run/teamledger-keyd
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/teamledger-keyd", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 6
    restart: unless-stopped

  migrate:
    <<: *team-ledger-image
    user: "${TEAMLEDGER_UID:?set TEAMLEDGER_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["umask 0007; exec /app/teamledger-migrate"]
    environment:
      TEAMLEDGER_BACKEND: sqlite
      TEAMLEDGER_DSN: /var/lib/teamledger/teamledger.db
    depends_on:
      data-init:
        condition: service_completed_successfully
    volumes:
      - team-ledger-data:/var/lib/teamledger
    restart: "no"

  audit-receiver:
    <<: *team-ledger-image
    user: "${TEAMLEDGER_AUDIT_RECEIVER_UID:?set TEAMLEDGER_AUDIT_RECEIVER_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/app/teamledger-audit-receiver"]
    environment:
      TEAMLEDGER_DB_BACKEND: sqlite
      TEAMLEDGER_DB_DSN: /var/lib/teamledger/teamledger.db
      TEAMLEDGER_DEPLOYMENT_ID: "${TEAMLEDGER_DEPLOYMENT_ID:?set TEAMLEDGER_DEPLOYMENT_ID}"
      TEAMLEDGER_AUDIT_LISTEN: 0.0.0.0:9443
      TEAMLEDGER_AUDIT_CA_FILE: /var/lib/teamledger-audit/material/receiver/ca.pem
      TEAMLEDGER_AUDIT_SERVER_CERT_FILE: /var/lib/teamledger-audit/material/receiver/server-cert.pem
      TEAMLEDGER_AUDIT_SERVER_KEY_FILE: /var/lib/teamledger-audit/material/receiver/server-key.pem
      TEAMLEDGER_AUDIT_SIGNER_FILE: /var/lib/teamledger-audit/material/receiver/signer.json
      TEAMLEDGER_AUDIT_HEALTH_ENDPOINT: https://audit-receiver:9443/health/ready
      TEAMLEDGER_AUDIT_HEALTH_CERT_FILE: /var/lib/teamledger-audit/material/receiver/health-cert.pem
      TEAMLEDGER_AUDIT_HEALTH_KEY_FILE: /var/lib/teamledger-audit/material/receiver/health-key.pem
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-audit:/var/lib/teamledger-audit:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_AUDIT_RECEIVER_UID:?set TEAMLEDGER_AUDIT_RECEIVER_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/teamledger-audit-receiver", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  audit-forwarder:
    <<: *team-ledger-image
    user: "${TEAMLEDGER_AUDIT_FORWARDER_UID:?set TEAMLEDGER_AUDIT_FORWARDER_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/app/teamledger-audit-forwarder"]
    environment:
      TEAMLEDGER_DB_BACKEND: sqlite
      TEAMLEDGER_DB_DSN: /var/lib/teamledger/teamledger.db
      TEAMLEDGER_DEPLOYMENT_ID: "${TEAMLEDGER_DEPLOYMENT_ID:?set TEAMLEDGER_DEPLOYMENT_ID}"
      TEAMLEDGER_AUDIT_ENDPOINT: https://audit-receiver:9443/v1/events
      TEAMLEDGER_AUDIT_CA_FILE: /var/lib/teamledger-audit/material/forwarder/ca.pem
      TEAMLEDGER_AUDIT_CLIENT_CERT_FILE: /var/lib/teamledger-audit/material/forwarder/client-cert.pem
      TEAMLEDGER_AUDIT_CLIENT_KEY_FILE: /var/lib/teamledger-audit/material/forwarder/client-key.pem
      TEAMLEDGER_AUDIT_RECEIPT_KEY_FILE: /var/lib/teamledger-audit/material/forwarder/receipt-keys.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      audit-receiver:
        condition: service_healthy
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-audit:/var/lib/teamledger-audit:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_AUDIT_FORWARDER_UID:?set TEAMLEDGER_AUDIT_FORWARDER_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    <<: *team-ledger-image
    build:
      context: .
      dockerfile: Dockerfile
    user: "${TEAMLEDGER_UID:?set TEAMLEDGER_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["umask 0007; exec /app/teamledger-api"]
    env_file:
      - path: .env.docker
        required: true
    environment:
      TEAMLEDGER_BACKEND: sqlite
      TEAMLEDGER_DSN: /var/lib/teamledger/teamledger.db
      TEAMLEDGER_LISTEN: 0.0.0.0:8443
      TEAMLEDGER_LISTEN_SCOPE: container
      TEAMLEDGER_WEB_DIR: /app/web
      TEAMLEDGER_TLS_CERT_FILE: /run/teamledger/tls-cert.pem
      TEAMLEDGER_TLS_KEY_FILE: /run/teamledger/tls-key.pem
      TEAMLEDGER_KEYD_SOCKET: /run/teamledger-keyd/keyd.sock
      TEAMLEDGER_DEPLOYMENT_ID: "${TEAMLEDGER_DEPLOYMENT_ID:?set TEAMLEDGER_DEPLOYMENT_ID}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyd:
        condition: service_healthy
      audit-receiver:
        condition: service_healthy
    ports:
      - "${TEAMLEDGER_BIND_ADDRESS:-127.0.0.1}:${TEAMLEDGER_DOCKER_PORT:-8443}:8443"
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-run:/run/teamledger-keyd
      - ./docker/secrets:/run/teamledger:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_UID:?set TEAMLEDGER_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--cacert", "/run/teamledger/tls-cert.pem", "--header", "Host: localhost:${TEAMLEDGER_DOCKER_PORT:-8443}", "https://localhost:8443/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  identity-bootstrap:
    <<: *team-ledger-image
    profiles: ["bootstrap"]
    user: "${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command:
      - /app/teamledger-identity
      - local-bootstrap
      - -backend
      - sqlite
      - -dsn-file
      - /run/teamledger-maintenance/sqlite-dsn
      - -keyd-socket
      - /run/teamledger-keyd/keyd.sock
      - -input-file
      - /run/teamledger-maintenance/local-bootstrap.json
      - -request-id
      - "${TEAMLEDGER_BOOTSTRAP_REQUEST_ID:?set TEAMLEDGER_BOOTSTRAP_REQUEST_ID}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyd:
        condition: service_healthy
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-run:/run/teamledger-keyd
      - ./docker/maintenance:/run/teamledger-maintenance:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  maintenance:
    <<: *team-ledger-image
    profiles: ["maintenance"]
    user: "${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/bin/true"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      keyd:
        condition: service_healthy
    volumes:
      - team-ledger-data:/var/lib/teamledger
      - team-ledger-run:/run/teamledger-keyd
      - ./docker/maintenance:/run/teamledger-maintenance:ro
      - ./docker/maintenance:/etc/teamledger:ro
      - ${TEAMLEDGER_BACKUP_DIR:-./backups}:/backup
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_MAINTENANCE_UID:?set TEAMLEDGER_MAINTENANCE_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  key-offline-export:
    <<: *team-ledger-image
    profiles: ["offline-keys"]
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/bin/true"]
    volumes:
      - team-ledger-keys:/var/lib/teamledger-keys
      - ./docker/key-offline:/run/teamledger-key-offline:ro
      - ${TEAMLEDGER_OFFLINE_MEDIA_A:-./offline-media-a}:/media/a
      - ${TEAMLEDGER_OFFLINE_MEDIA_B:-./offline-media-b}:/media/b
      - ${TEAMLEDGER_OFFLINE_RESTORE_DIR:-./offline-restore}:/restore
      - /etc/machine-id:/run/teamledger-host-identity:ro
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

  key-offline-verify:
    <<: *team-ledger-image
    profiles: ["offline-keys"]
    user: "${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID}:${TEAMLEDGER_GID:?set TEAMLEDGER_GID}"
    command: ["/bin/true"]
    volumes:
      - ./docker/key-offline:/run/teamledger-key-offline:ro
      - ${TEAMLEDGER_OFFLINE_MEDIA_A:-./offline-media-a}:/media/a:ro
      - ${TEAMLEDGER_OFFLINE_MEDIA_B:-./offline-media-b}:/media/b:ro
      - ${TEAMLEDGER_OFFLINE_RESTORE_DIR:-./offline-restore}:/restore
    read_only: true
    tmpfs:
      - /tmp:mode=0700,uid=${TEAMLEDGER_KEYD_UID:?set TEAMLEDGER_KEYD_UID},gid=${TEAMLEDGER_GID:?set TEAMLEDGER_GID}
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  team-ledger-data:
    name: ${TEAMLEDGER_DATA_VOLUME:-team-ledger-data}
  team-ledger-keys:
    name: ${TEAMLEDGER_KEY_VOLUME:-team-ledger-keys}
  team-ledger-audit:
    name: ${TEAMLEDGER_AUDIT_VOLUME:-team-ledger-audit}
  team-ledger-run:
